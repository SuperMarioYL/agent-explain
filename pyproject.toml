[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-explain"
version = "0.2.0"
description = "Dry-run EXPLAIN for coding-agent plans: per-step token, tool-call, risk-class, and files-touched projection before you approve."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "SuperMarioYL", email = "leo.stack@outlook.com" }]
keywords = [
    "agent",
    "coding-agent",
    "explain",
    "plan",
    "token",
    "dry-run",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "tiktoken>=0.7",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.scripts]
agent-explain = "agent_explain.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/agent-explain"
Issues = "https://github.com/SuperMarioYL/agent-explain/issues"
Source = "https://github.com/SuperMarioYL/agent-explain"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_explain"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
